<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <style>
    /* Reset & base */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 20%, #222 0%, #111 40%, #0c0c0c 100%);
      color: #eaeaea;
    }

    :root {
      --bg: #111214;
      --panel: #1a1c1f;
      --border: #292c31;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #4cc9f0;
      --op: #ff7b7b;
      --eq: #7cf989;
      --key: #23262b;
      --key-hover: #2b2f35;
      --key-active: #202327;
    }

    .app { 
      min-height: 100vh; 
      display: grid; 
      place-items: center; 
      padding: 24px; 
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .calc-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .calc-header h1 {
      margin: 0;
      font-size: 16px;
      color: var(--muted);
      font-weight: 600;
    }

    .display {
      padding: 16px;
      min-height: 96px;
      display: grid;
      align-content: end;
      gap: 6px;
      background: linear-gradient(180deg, #16181c 0%, #14161a 100%);
    }
    .previous-operand {
      min-height: 18px;
      color: var(--muted);
      font-size: 14px;
      text-align: right;
    }
    .current-operand {
      color: var(--text);
      font-size: 32px;
      line-height: 1.25;
      text-align: right;
      word-wrap: break-word;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
    }

    .key {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--key);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.06s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
    }
    .key:hover { background: var(--key-hover); }
    .key:active { background: var(--key-active); transform: translateY(1px); }

    .key.function { color: var(--accent); }
    .key.operator { color: var(--op); }
    .key.equals { background: #19351c; color: var(--eq); border-color: #27502d; }
    .key.equals:hover { background: #204323; }
    .key.equals:active { background: #1a3920; }

    /* Make 0 stretch horizontally for nicer layout */
    .key[data-number="0"] { grid-column: span 1; }

    .app-footer {
      text-align: center;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Responsive tweaks */
    @media (max-width: 360px) {
      .calculator { max-width: 320px; }
      .current-operand { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Basic calculator">
      <header class="calc-header">
        <h1>Calculator</h1>
      </header>

      <div class="display" role="textbox" aria-live="polite" aria-label="Calculator display">
        <div id="previous-operand" class="previous-operand"></div>
        <div id="current-operand" class="current-operand">0</div>
      </div>

      <div class="keys" role="group" aria-label="Calculator keys">
        <!-- Row 1 -->
        <button class="key function" data-action="clear">AC</button>
        <button class="key function" data-action="delete">DEL</button>
        <button class="key function" data-action="percent">%</button>
        <button class="key operator" data-action="operator" data-op="divide">÷</button>

        <!-- Row 2 -->
        <button class="key number" data-action="number" data-number="7">7</button>
        <button class="key number" data-action="number" data-number="8">8</button>
        <button class="key number" data-action="number" data-number="9">9</button>
        <button class="key operator" data-action="operator" data-op="multiply">×</button>

        <!-- Row 3 -->
        <button class="key number" data-action="number" data-number="4">4</button>
        <button class="key number" data-action="number" data-number="5">5</button>
        <button class="key number" data-action="number" data-number="6">6</button>
        <button class="key operator" data-action="operator" data-op="subtract">−</button>

        <!-- Row 4 -->
        <button class="key number" data-action="number" data-number="1">1</button>
        <button class="key number" data-action="number" data-number="2">2</button>
        <button class="key number" data-action="number" data-number="3">3</button>
        <button class="key operator" data-action="operator" data-op="add">+</button>

        <!-- Row 5 -->
        <button class="key function" data-action="toggle-sign">±</button>
        <button class="key number" data-action="number" data-number="0">0</button>
        <button class="key function" data-action="decimal">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
    </section>
    <footer class="app-footer">
      <p>Keyboard: 0-9, + - * /, Enter, Backspace, Esc, %</p>
    </footer>
  </main>

  <script>
    // Calculator logic with keyboard support
    (function () {
      const currentEl = document.getElementById('current-operand');
      const previousEl = document.getElementById('previous-operand');
      const keys = document.querySelectorAll('.key');

      let current = '0';
      let previous = '';
      let operation = null; // 'add' | 'subtract' | 'multiply' | 'divide'
      let justEvaluated = false;

      function updateDisplay() {
        previousEl.textContent = previous ? `${previous} ${symbolForOp(operation)}` : '';
        currentEl.textContent = current || '0';
      }

      function symbolForOp(op) {
        switch (op) {
          case 'add': return '+';
          case 'subtract': return '−';
          case 'multiply': return '×';
          case 'divide': return '÷';
          default: return '';
        }
      }

      function clear() {
        current = '0';
        previous = '';
        operation = null;
        justEvaluated = false;
        updateDisplay();
      }

      function del() {
        if (justEvaluated) { justEvaluated = false; }
        if (current.length > 1) {
          current = current.slice(0, -1);
        } else {
          current = '0';
        }
        updateDisplay();
      }

      function appendNumber(num) {
        if (justEvaluated) { current = '0'; justEvaluated = false; }
        if (current === '0' && num !== '.') {
          current = String(num);
        } else {
          current += String(num);
        }
        updateDisplay();
      }

      function addDecimal() {
        if (justEvaluated) { justEvaluated = false; }
        if (!current.includes('.')) {
          current += '.';
          updateDisplay();
        }
      }

      function toggleSign() {
        if (current === '0') return;
        if (current.startsWith('-')) current = current.slice(1);
        else current = '-' + current;
        updateDisplay();
      }

      function percent() {
        const value = Number(current);
        if (!Number.isFinite(value)) return;
        current = String(value / 100);
        updateDisplay();
      }

      function chooseOperation(op) {
        const currVal = Number(current);
        if (!Number.isFinite(currVal)) return;

        if (previous !== '') {
          // Chain operations: compute previous first
          compute();
        }

        operation = op;
        previous = current;
        current = '0';
        justEvaluated = false;
        updateDisplay();
      }

      function compute() {
        if (operation == null || previous === '') return;
        const a = Number(previous);
        const b = Number(current);

        let result;
        switch (operation) {
          case 'add': result = a + b; break;
          case 'subtract': result = a - b; break;
          case 'multiply': result = a * b; break;
          case 'divide':
            if (b === 0) {
              current = 'Error';
              previous = '';
              operation = null;
              justEvaluated = true;
              updateDisplay();
              return;
            }
            result = a / b; break;
          default: return;
        }

        current = formatNumber(result);
        previous = '';
        operation = null;
        justEvaluated = true;
        updateDisplay();
      }

      function formatNumber(n) {
        // Limit to reasonable precision and strip trailing zeros
        const str = String(Number(n.toFixed(12))); // cap precision
        // Remove trailing .0 if present
        return str.replace(/\.0+$/, '');
      }

      // Click handling
      keys.forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.getAttribute('data-action');
          switch (action) {
            case 'number':
              appendNumber(btn.getAttribute('data-number'));
              break;
            case 'decimal':
              addDecimal();
              break;
            case 'toggle-sign':
              toggleSign();
              break;
            case 'percent':
              percent();
              break;
            case 'delete':
              del();
              break;
            case 'clear':
              clear();
              break;
            case 'operator':
              chooseOperation(btn.getAttribute('data-op'));
              break;
            case 'equals':
              compute();
              break;
            default:
              break;
          }
        });
      });

      // Keyboard support
      document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (/^[0-9]$/.test(key)) {
          appendNumber(key);
          return;
        }
        if (key === '.') { addDecimal(); return; }

        if (key === '+' || key === '-' || key === '*' || key === '/') {
          const mapping = { '+': 'add', '-': 'subtract', '*': 'multiply', '/': 'divide' };
          chooseOperation(mapping[key]);
          return;
        }

        if (key === 'Enter' || key === '=') { e.preventDefault(); compute(); return; }
        if (key === 'Backspace') { del(); return; }
        if (key === 'Escape') { clear(); return; }
        if (key === '%') { percent(); return; }
      });

      // Initialize
      updateDisplay();
    })();
  </script>
</body>
</html>
